name: Build

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                include:
                    - goos: linux
                      goarch: amd64
                    - goos: linux
                      goarch: arm64
                    - goos: windows
                      goarch: amd64
                    - goos: windows
                      goarch: arm64
                    - goos: darwin
                      goarch: amd64
                    - goos: darwin
                      goarch: arm64

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-go@v5
              with:
                  go-version-file: go.mod
                  cache: true

            - name: Build
              env:
                  CGO_ENABLED: 0
                  GOOS: ${{ matrix.goos }}
                  GOARCH: ${{ matrix.goarch }}
              run: |
                  mkdir -p dist
                  for command in db2toon pg2toon db2toon-mcp; do
                    binary_name="${command}"
                    if [ "${{ matrix.goos }}" = "windows" ]; then
                      binary_name="${binary_name}.exe"
                    fi
                    go build -o "dist/${binary_name}" "./cmd/${command}"
                    final_name="${{ matrix.goarch }}-${{ matrix.goos }}-${binary_name}"
                    mv "dist/${binary_name}" "dist/${final_name}"
                  done

            - name: Upload to Release
              uses: softprops/action-gh-release@v1
              with:
                  files: dist/*
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
