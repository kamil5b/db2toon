name: Build

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:

permissions:
    contents: write
    packages: write
    id-token: write

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-go@v5
              with:
                  go-version-file: go.mod
                  cache: true

            - name: Unit tests
              env:
                  CGO_ENABLED: 0
              run: go test ./...

            - name: Integration tests
              env:
                  CGO_ENABLED: 0
              run: go test -tags=integration ./internal/database/postgres ./internal/mcp

    build:
        needs: test
        runs-on: ubuntu-latest
        strategy:
            matrix:
                include:
                    - goos: linux
                      goarch: amd64
                    - goos: linux
                      goarch: arm64
                    - goos: windows
                      goarch: amd64
                    - goos: windows
                      goarch: arm64
                    - goos: darwin
                      goarch: amd64
                    - goos: darwin
                      goarch: arm64

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-go@v5
              with:
                  go-version-file: go.mod
                  cache: true

            - name: Build
              env:
                  CGO_ENABLED: 0
                  GOOS: ${{ matrix.goos }}
                  GOARCH: ${{ matrix.goarch }}
              run: |
                  mkdir -p dist
                  for command in db2toon pg2toon db2toon-mcp; do
                    binary_name="${command}"
                    if [ "${{ matrix.goos }}" = "windows" ]; then
                      binary_name="${binary_name}.exe"
                    fi
                    go build -o "dist/${binary_name}" "./cmd/${command}"
                    final_name="${{ matrix.goarch }}-${{ matrix.goos }}-${binary_name}"
                    mv "dist/${binary_name}" "dist/${final_name}"
                    sha256sum "dist/${final_name}" > "dist/${final_name}.sha256"
                  done

            - name: Upload to Release
              if: startsWith(github.ref, 'refs/tags/v')
              uses: softprops/action-gh-release@v2
              with:
                  files: dist/*
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    publish-image:
        name: Publish MCP container
        needs: test
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        outputs:
            image: ${{ steps.image.outputs.name }}
        steps:
            - uses: actions/checkout@v4

            - name: Determine image name
              id: image
              shell: bash
              run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push MCP image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: Dockerfile.mcp
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: |
                      ${{ steps.image.outputs.name }}:${{ github.ref_name }}
                      ${{ steps.image.outputs.name }}:latest
                  labels: |
                      org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
                      org.opencontainers.image.revision=${{ github.sha }}
                      org.opencontainers.image.version=${{ github.ref_name }}
                      io.modelcontextprotocol.server.name=io.github.kamil5b/db2toon-mcp

    publish-registry:
        name: Publish to MCP Registry
        needs: publish-image
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@v4

            - name: Prepare server.json
              env:
                  IMAGE: ${{ needs.publish-image.outputs.image }}
                  TAG: ${{ github.ref_name }}
              run: |
                  VERSION="${TAG#v}"
                  jq \
                    --arg version "$VERSION" \
                    --arg identifier "${IMAGE}:${TAG}" \
                    '.version = $version
                     | .packages[0].registryType = "oci"
                     | .packages[0].identifier = $identifier' \
                    server.json > server.tmp.json
                  mv server.tmp.json server.json
                  cat server.json

            - name: Install mcp-publisher
              shell: bash
              run: |
                  curl -L \
                    "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
                    | tar xz mcp-publisher
                  chmod +x mcp-publisher

            - name: Authenticate to MCP Registry
              run: ./mcp-publisher login github-oidc

            - name: Publish to MCP Registry
              run: ./mcp-publisher publish
